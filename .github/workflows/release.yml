# Build and publish a universal freetp.arach (Windows + Linux).
#
#   git tag v1.0.29 && git push origin v1.0.29
# or Actions -> Release -> Run workflow (version = 1.0.29).
#
# Toolchain is locked to Arachnel release.yml — edit scripts/ci/launcher-toolchain.env.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version without "v" (e.g. 1.0.29)'
        required: true
        type: string
      publish_sourcelist:
        description: 'Trigger the GitLab sourcelist ingest after the release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  ARACHNEL_SKIP_FREETP_CATALOG_FETCH: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            TAG="v${INPUT_VERSION#v}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            TAG="${REF_NAME}"
          else
            echo "Need a tag or a version input" >&2
            exit 1
          fi
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ git ninja-build patchelf python3 python3-pip python3-venv zip unzip libglib2.0-0

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .ci/qt
            .ci/aqt-venv
          key: qt-linux-${{ hashFiles('scripts/ci/launcher-toolchain.env') }}

      - name: Build plugin
        run: bash scripts/ci/build-plugin.sh

      # verify jobs run in bare distro containers: hand them just the Qt libs
      # the plugin links against (check-linux-runtime.sh looks under .ci/qt/).
      - name: Stage Qt runtime for verify
        run: |
          set -euo pipefail
          QT_LIB="$(ls -d "${PWD}"/.ci/qt/*/gcc_64/lib)"
          mkdir -p qt-runtime
          for f in libQt6Core.so.6 libQt6Network.so.6; do
            cp -aL "${QT_LIB}/${f}" qt-runtime/
          done
          for f in libQt6Core.so.6 libQt6Network.so.6; do
            LD_LIBRARY_PATH="${QT_LIB}" ldd "qt-runtime/${f}" \
              | awk -v qt="${QT_LIB}/" 'index($3, qt) == 1 { print $3 }' \
              | while read -r dep; do cp -aL "${dep}" qt-runtime/; done
          done
          ls -lh qt-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: freetp-linux
          path: dist/linux/freetp.arach
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: qt-runtime
          path: qt-runtime
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .ci/qt
            .ci/aqt-venv
          key: qt-windows-${{ hashFiles('scripts/ci/launcher-toolchain.env') }}

      - name: Build plugin
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/build-plugin.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: freetp-windows
          path: dist/windows/freetp.arach
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - uses: actions/download-artifact@v4
        with:
          name: freetp-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: freetp-windows
          path: dist/windows

      - name: Merge universal bundle
        run: bash scripts/ci/merge-universal-arach.sh

      - uses: actions/upload-artifact@v4
        with:
          name: freetp-universal
          path: dist/universal/freetp.arach
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [build-linux, package]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'fedora:40', 'archlinux:latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: freetp-universal
          path: dist/universal

      - uses: actions/download-artifact@v4
        with:
          name: qt-runtime
          path: .ci/qt/lib

      - name: Check Linux runtime in ${{ matrix.image }}
        run: |
          docker run --rm -v "${PWD}:/w" -w /w "${{ matrix.image }}" bash -ec '
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends bash binutils patchelf python3 unzip libglib2.0-0
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y bash binutils patchelf python3 unzip glib2
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm bash binutils patchelf python unzip glib2
            fi
            rm -rf dist/universal/.verify
            mkdir -p dist/universal/.verify
            unzip -q dist/universal/freetp.arach -d dist/universal/.verify
            ROOT="$(find dist/universal/.verify -name plugin.json -printf "%h\n" | head -n 1)"
            test -n "${ROOT}"
            bash scripts/ci/check-linux-runtime.sh "${ROOT}/libfreetp_plugin.so" "${ROOT}"
          '

  release:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    outputs:
      download_url: ${{ steps.publish.outputs.download_url }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freetp-universal
          path: dist/universal

      - name: Publish GitHub Release
        id: publish
        run: |
          cat > release-notes.md <<EOF
          # FreeTP plugin ${TAG}

          Install in Arachnel: **Settings → Plugins** → \`freetp.arach\`.

          One universal bundle for **Windows and Linux**:
          - \`freetp_plugin.dll\` (Windows / MinGW, Qt 6.11.1)
          - \`libfreetp_plugin.so\` (Linux / gcc, Qt 6.11.1)

          Built against the same toolchain as [Arachnel releases](https://github.com/BadKiko/Arachnel/releases).
          Requires Arachnel plugin API v4 (JSON catalog). Arachnel v0.1.34+ picks this build;
          older launchers keep installing the last API v2 package from sourcelist history.
          EOF

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/universal/freetp.arach --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/universal/freetp.arach \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "FreeTP plugin ${TAG}" \
              --notes-file release-notes.md
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/freetp.arach"
          echo "download_url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "Published ${URL}"

  publish-sourcelist:
    needs: [prepare, release]
    if: github.event_name == 'push' || github.event.inputs.publish_sourcelist == 'true'
    runs-on: ubuntu-24.04
    env:
      SOURCELIST_TRIGGER_TOKEN: ${{ secrets.SOURCELIST_TRIGGER_TOKEN }}
      SOURCELIST_PROJECT: BadKiko%2Farachnel-plugins-sourcelist
    steps:
      - name: Trigger sourcelist ingest (GitLab)
        env:
          DOWNLOAD_URL: ${{ needs.release.outputs.download_url }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ -z "${SOURCELIST_TRIGGER_TOKEN}" ]]; then
            echo "::warning::SOURCELIST_TRIGGER_TOKEN is not set - sourcelist was NOT updated. Ingest ${DOWNLOAD_URL} manually."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            --form "token=${SOURCELIST_TRIGGER_TOKEN}" \
            --form "ref=main" \
            --form "variables[INGEST_DOWNLOAD_URL]=${DOWNLOAD_URL}" \
            --form "variables[INGEST_ARACH_NAME]=freetp.arach" \
            --form "variables[INGEST_TAG]=${TAG}" \
            --form "variables[INGEST_MIN_ARACHNEL]=0.1.34" \
            --form "variables[INGEST_MAX_ARACHNEL]=" \
            --form "variables[INGEST_ABI_TOKEN]=develop" \
            "https://gitlab.com/api/v4/projects/${SOURCELIST_PROJECT}/trigger/pipeline"
