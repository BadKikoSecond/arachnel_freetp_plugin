# Tag a commit on main to build and publish a universal freetp.arach (Windows + Linux).
# Toolchain is locked to Arachnel GitHub release.yml — edit scripts/ci/launcher-toolchain.env
# Example: git tag v1.0.14 && git push BadKiko v1.0.14

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/
    - when: never

stages:
  - build
  - package
  - verify
  - release
  - publish

variables:
  ARACHNEL_SKIP_FREETP_CATALOG_FETCH: "1"

build:linux:
  stage: build
  image: ubuntu:24.04
  tags:
    - linux
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates cmake g++ git ninja-build patchelf python3 python3-pip python3-venv zip unzip libglib2.0-0
  script:
    - bash scripts/ci/build-plugin.sh
  artifacts:
    name: freetp-linux-$CI_COMMIT_TAG
    paths:
      - .ci/qt/
      - dist/linux/freetp.arach
    expire_in: 7 days

build:windows:
  stage: build
  # Home PC shell runner. Do not leave untagged - Windows would steal linux jobs.
  tags:
    - windows
  timeout: 2h
  before_script:
    # Runner is LocalSystem: user PATH / choco are often missing. Prefer known installs.
    - |
      $ErrorActionPreference = 'Stop'
      if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
        $candidates = @(
          'C:\Users\kiril\AppData\Local\Programs\Python\Python311\python.exe',
          'C:\Users\kiril\AppData\Local\Programs\Python\Python312\python.exe',
          'C:\Program Files\Python311\python.exe',
          'C:\Program Files\Python312\python.exe'
        )
        $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $found) { throw 'python not found for LocalSystem runner. Install Python for all users or add it to Machine PATH.' }
        $dir = Split-Path -Parent $found
        $env:Path = "$dir;$(Join-Path $dir 'Scripts');$env:Path"
      }
      if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
        throw '7-Zip not found at C:\Program Files\7-Zip\7z.exe'
      }
      python --version
      if (-not $env:QT_INSTALL_DIR) { $env:QT_INSTALL_DIR = 'D:\Qt' }
      if (-not $env:QT_VERSION) { $env:QT_VERSION = '6.11.1' }
      if (-not $env:ARACHNEL_SDK_DIR -and (Test-Path 'D:\Work\Arachnel\cmake\ArachnelPluginSdk.cmake')) {
        $env:ARACHNEL_SDK_DIR = 'D:\Work\Arachnel'
      }
  script:
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/build-plugin.ps1
  artifacts:
    name: freetp-windows-$CI_COMMIT_TAG
    paths:
      - dist/windows/freetp.arach
    expire_in: 7 days

package:universal:
  stage: package
  image: ubuntu:24.04
  tags:
    - linux
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends zip unzip
  script:
    - bash scripts/ci/merge-universal-arach.sh
  artifacts:
    name: freetp-universal-$CI_COMMIT_TAG
    paths:
      - dist/universal/freetp.arach
    expire_in: 30 days

.verify-linux-runtime:
  stage: verify
  tags:
    - linux
  needs:
    - job: build:linux
      artifacts: true
    - job: package:universal
      artifacts: true
  script:
    - |
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        # libglib: Qt smoke needs it (comes from AppImage/desktop at runtime)
        apt-get install -y --no-install-recommends bash binutils patchelf python3 unzip libglib2.0-0
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y bash binutils patchelf python3 unzip glib2
      elif command -v pacman >/dev/null 2>&1; then
        pacman -Sy --noconfirm bash binutils patchelf python unzip glib2
      fi
    - rm -rf dist/universal/.verify
    - mkdir -p dist/universal/.verify
    - unzip -q dist/universal/freetp.arach -d dist/universal/.verify
    - |
      ROOT="$(find dist/universal/.verify -name plugin.json -printf '%h\n' | head -n 1)"
      test -n "${ROOT}"
      bash scripts/ci/check-linux-runtime.sh "${ROOT}/libfreetp_plugin.so" "${ROOT}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

verify:ubuntu:
  extends: .verify-linux-runtime
  image: ubuntu:24.04

verify:fedora:
  extends: .verify-linux-runtime
  image: fedora:40

verify:arch:
  extends: .verify-linux-runtime
  image: archlinux:latest

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - linux
  needs:
    - job: package:universal
      artifacts: true
    - job: verify:ubuntu
    - job: verify:fedora
    - job: verify:arch
  before_script:
    - apk add --no-cache curl jq
  script:
    - cp dist/universal/freetp.arach freetp.arach
    - |
      cat > release-notes.md <<EOF
      # FreeTP plugin ${CI_COMMIT_TAG}

      Install in Arachnel: **Settings → Plugins** → \`freetp.arach\`.

      One universal bundle for **Windows and Linux**:
      - \`freetp_plugin.dll\` (Windows / MinGW, Qt 6.11.1)
      - \`libfreetp_plugin.so\` (Linux / gcc, Qt 6.11.1)

      Built against the same toolchain as [Arachnel GitHub releases](https://github.com/BadKiko/Arachnel/releases).
      Requires Arachnel plugin API v4 (JSON catalog). Arachnel v0.1.34+ picks this build;
      older launchers keep installing the last API v2 package from sourcelist history.
      EOF
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file freetp.arach \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freetp/${CI_COMMIT_TAG}/freetp.arach"
    - |
      PACKAGE_ID="$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=generic&package_name=freetp&package_version=${CI_COMMIT_TAG}" \
        | jq -r '.[0].id')"
      FILE_ID="$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}/package_files" \
        | jq -r '.[0].id')"
      DOWNLOAD_URL="${CI_PROJECT_URL}/-/package_files/${FILE_ID}/download"
      echo "DOWNLOAD_URL=${DOWNLOAD_URL}" > download.env
      # Retags reuse the same tag name - drop prior Release so create is idempotent.
      curl -fsS --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" \
        >/dev/null 2>&1 || true
      release-cli create \
        --name "FreeTP plugin ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat release-notes.md)" \
        --assets-link "[{\"name\":\"freetp.arach\",\"url\":\"${DOWNLOAD_URL}\",\"link_type\":\"package\"}]"
  artifacts:
    reports:
      dotenv: download.env
    paths:
      - freetp.arach
      - download.env
    expire_in: 7 days

publish-sourcelist:
  stage: publish
  needs:
    - job: release
      artifacts: true
  # Bridge job (no runner). Downstream sourcelist downloads the package and pushes plugins.json.
  variables:
    INGEST_DOWNLOAD_URL: $DOWNLOAD_URL
    INGEST_ARACH_NAME: freetp.arach
    INGEST_TAG: $CI_COMMIT_TAG
    INGEST_MIN_ARACHNEL: "0.1.34"
    INGEST_MAX_ARACHNEL: ""
    INGEST_ABI_TOKEN: develop
  trigger:
    project: BadKiko/arachnel-plugins-sourcelist
    branch: main
    strategy: depend
