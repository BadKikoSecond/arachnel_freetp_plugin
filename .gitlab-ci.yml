# Tag a commit on main to build and publish a universal freetp.arach (Windows + Linux).
# Toolchain is locked to Arachnel GitHub release.yml — edit scripts/ci/launcher-toolchain.env
# Example: git tag v1.0.14 && git push BadKiko v1.0.14

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/
    - when: never

stages:
  - build
  - package
  - release

variables:
  ARACHNEL_SKIP_FREETP_CATALOG_FETCH: "1"

build:linux:
  stage: build
  image: ubuntu:24.04
  tags:
    - vps
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates cmake g++ git ninja-build patchelf python3 python3-pip python3-venv zip unzip
  script:
    - bash scripts/ci/build-plugin.sh
  artifacts:
    name: freetp-linux-$CI_COMMIT_TAG
    paths:
      - dist/linux/freetp.arach
    expire_in: 7 days

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 2h
  before_script:
    - if (-not (Get-Command python -ErrorAction SilentlyContinue)) { choco install python3 -y --no-progress --execution-timeout 1200 }
    - python --version
  script:
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/build-plugin.ps1
  artifacts:
    name: freetp-windows-$CI_COMMIT_TAG
    paths:
      - dist/windows/freetp.arach
    expire_in: 7 days

package:universal:
  stage: package
  image: ubuntu:24.04
  tags:
    - vps
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends zip unzip
  script:
    - bash scripts/ci/merge-universal-arach.sh
  artifacts:
    name: freetp-universal-$CI_COMMIT_TAG
    paths:
      - dist/universal/freetp.arach
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - vps
  needs:
    - job: package:universal
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - cp dist/universal/freetp.arach freetp.arach
    - |
      cat > release-notes.md <<EOF
      # FreeTP plugin ${CI_COMMIT_TAG}

      Install in Arachnel: **Settings → Plugins** → \`freetp.arach\`.

      One universal bundle for **Windows and Linux**:
      - \`freetp_plugin.dll\` (Windows / MSVC 2022, Qt 6.8.2)
      - \`libfreetp_plugin.so\` (Linux / gcc, Qt 6.8.2)

      Built against the same toolchain as [Arachnel GitHub releases](https://github.com/BadKiko/Arachnel/releases).
      Requires Arachnel **v0.1.5+** from GitHub Release (not MinGW dev builds).
      Requires Arachnel plugin API v2.
      EOF
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file freetp.arach \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freetp/${CI_COMMIT_TAG}/freetp.arach"
    - |
      PACKAGE_ID="$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=generic&package_name=freetp&package_version=${CI_COMMIT_TAG}" \
        | jq -r '.[0].id')"
      FILE_ID="$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}/package_files" \
        | jq -r '.[0].id')"
      DOWNLOAD_URL="${CI_PROJECT_URL}/-/package_files/${FILE_ID}/download"
      release-cli create \
        --name "FreeTP plugin ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat release-notes.md)" \
        --assets-link "[{\"name\":\"freetp.arach\",\"url\":\"${DOWNLOAD_URL}\",\"link_type\":\"package\"}]"
